services:
  mlflow:
    build:
      context: ./mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg://admo:admo123@postgres:5432/mlflow
      --artifacts-destination s3://admo/mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://garage:3900
      AWS_ACCESS_KEY_ID: ${GARAGE_DEFAULT_ACCESS_KEY:-GKADMOLOCAL}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_DEFAULT_SECRET_KEY:-admo_dev_secret_key_change_me}
      AWS_DEFAULT_REGION: ${GARAGE_DEFAULT_REGION:-garage}
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
    ports:
      - "${MLFLOW_PORT:-5000}:5000"

networks:
  default:
    name: ${ADMO_DOCKER_NETWORK:-admo_default}
