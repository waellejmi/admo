services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admo}
      POSTGRES_USER: ${POSTGRES_USER:-admo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admo123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - admo-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:-GKADMOLOCAL}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:-admo_dev_secret_key_change_me}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:-admo}
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
      - "${GARAGE_RPC_PORT:-3901}:3901"
      - "${GARAGE_WEB_PORT:-3902}:3902"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - admo-garage-meta:/var/lib/garage/meta
      - admo-garage-data:/var/lib/garage/data
volumes:
  admo-postgres-data:
  admo-garage-meta:
  admo-garage-data:
networks:
  default:
    name: ${ADMO_DOCKER_NETWORK:-admo_default}
