services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admo}
      POSTGRES_USER: ${POSTGRES_USER:-admo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admo_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - admo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admo_dev_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - admo-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admo_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-admo}

volumes:
  admo-postgres-data:
  admo-minio-data:
