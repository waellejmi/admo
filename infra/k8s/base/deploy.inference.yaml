apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: admo
  labels:
    app: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      containers:
        - name: inference
          image: admo-inference:dev
          env:
            - name: ADMO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: ADMO_DATABASE_URI
            - name: ADMO_OBJECT_STORAGE_ENDPOINT
              value: "http://garage:3900"
            - name: ADMO_OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-creds
                  key: GARAGE_DEFAULT_ACCESS_KEY
            - name: ADMO_OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-creds
                  key: GARAGE_DEFAULT_SECRET_KEY
            - name: ADMO_OBJECT_STORAGE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: garage-creds
                  key: GARAGE_DEFAULT_BUCKET
            - name: ADMO_OBJECT_STORAGE_REGION
              valueFrom:
                secretKeyRef:
                  name: garage-creds
                  key: GARAGE_DEFAULT_REGION
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
