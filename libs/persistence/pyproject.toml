[project]
name = "admo-persistence"
version = "0.1.0"
description = "PostgreSQL metadata and object-storage integration for ADMO"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.100",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.0.54",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
