[project]
name = "ingestion"
version = "0.1.0"
description = "Raw source dataset ingestion workload for ADMO"
requires-python = ">=3.13"
dependencies = [
    "admo-persistence",
    "pandas>=3.0.5",
    "pyarrow>=21.0.0",
]

[project.scripts]
admo-ingest = "admo_ingestion.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "admo_ingestion"

[tool.uv.sources]
admo-persistence = { workspace = true }
