[project]
name = "processing-ml"
version = "0.1.0"
description = "Machine learning processing and anomaly detection service"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "admo-persistence",
    "joblib>=1.6.0",
    "mlflow>=3.16.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
admo-train = "processing_ml.training:main"

[tool.uv.sources]
admo-persistence = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
