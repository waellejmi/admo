[project]
name = "processing-ml"
version = "0.1.0"
description = "Machine learning processing and anomaly detection service"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "pandas>=3.0.5",
    "pyarrow>=21.0.0",
    "joblib>=1.5.2",
    "scikit-learn>=1.7.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
