[project]
name = "inference"
version = "0.1.0"
description = "Local anomaly inference API for ADMO"
requires-python = ">=3.13"
dependencies = [
    "admo-persistence",
    "fastapi>=0.129,<0.137",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "processing-ml",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv.sources]
admo-persistence = { workspace = true }
processing-ml = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "admo_inference"
